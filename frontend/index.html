<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LOOM // Personal Intelligence OS</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Share+Tech+Mono&family=Fira+Code:wght@400;500&family=Cutive+Mono&display=swap" rel="stylesheet">
  </head>
  <body>
    <script>
      (function(){try{var s=localStorage.getItem('loom-settings');if(s){var j=JSON.parse(s);if(j.theme&&/^(phosphor|ruby|sapphire|diamond|ebony)$/.test(j.theme))document.documentElement.dataset.theme=j.theme;}}catch(e){})();
      
      // Suppress service worker errors for chrome-extension:// URLs (common in Electron)
      if ('serviceWorker' in navigator) {
        // Unregister any existing service workers
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        });
        
        // Suppress service worker cache errors
        const originalPut = Cache.prototype.put;
        Cache.prototype.put = function(request, response) {
          if (request instanceof Request && request.url.startsWith('chrome-extension://')) {
            return Promise.resolve();
          }
          return originalPut.call(this, request, response).catch(function(error) {
            if (error.message && error.message.includes('chrome-extension')) {
              // Silently ignore chrome-extension caching errors
              return;
            }
            throw error;
          });
        };
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
