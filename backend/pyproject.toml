[project]
name = "loom-backend"
version = "0.1.0"
description = "Loom Personal Intelligence OS - Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.1",
    "python-multipart>=0.0.7",
    "uvicorn[standard]>=0.27.0",
    "python-socketio>=5.10.0",
    "ollama>=0.1.6",
    "chromadb>=0.4.22",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.26.0",
    "pymupdf>=1.23.0",
    "psutil>=5.9.0",
    "uvloop>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
]
image = [
    "torch>=2.1.0",
    "diffusers>=0.25.0",
    "transformers>=4.36.0",
    "accelerate>=0.25.0",
    "safetensors>=0.4.0",
]
music = [
    "scipy>=1.10.0",
    "soundfile>=0.12.1",
    "huggingface_hub>=0.20.0",
]
web = [
    "playwright>=1.41.0",
    "playwright-stealth>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "readability-lxml>=0.8.1",
    "ddgs>=9.0",
]
cloud = [
    "openai>=1.12.0",
    "anthropic>=0.44.0",
    "google-genai>=1.0.0",
    "mistralai>=1.0.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"
