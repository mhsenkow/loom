[project]
name = "loom-backend"
version = "0.1.0"
description = "Loom Personal Intelligence OS - Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.109.1",
    "python-multipart>=0.0.7",
    "uvicorn[standard]>=0.27.0",
    "python-socketio>=5.10.0",
    "ollama>=0.1.6",
    "chromadb>=0.4.22",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.26.0",
]

[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"
