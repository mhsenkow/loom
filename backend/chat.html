<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Loom Chat</title>
    <script src="https://cdn.socket.io/4.7.0/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            height: 100vh;
            height: 100dvh; /* Dynamic viewport height for mobile */
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: fixed;
            width: 100%;
            left: 0;
            top: 0;
        }

        .header {
            background: #1a1a1a;
            padding: 0.75rem 1rem;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
            min-height: 48px;
        }

        .header h1 {
            font-size: 1.1rem;
            color: #00ff88;
            font-weight: 600;
            margin: 0;
        }

        .context-usage {
            flex-shrink: 0;
            background: #111;
            border-bottom: 1px solid #222;
            padding: 0.35rem 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            color: #888;
        }

        .context-usage-bar {
            flex: 1;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            min-width: 60px;
        }

        .context-usage-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00cc6a);
            border-radius: 3px;
            transition: width 0.2s ease;
        }

        .context-usage-fill.warn {
            background: linear-gradient(90deg, #ffaa00, #ff8800);
        }

        .context-usage-fill.danger {
            background: linear-gradient(90deg, #ff4444, #cc2222);
        }

        .context-usage-text {
            white-space: nowrap;
            font-variant-numeric: tabular-nums;
            min-width: 5.5em;
        }
        
        @media (max-width: 360px) {
            .context-usage {
                padding: 0.3rem 0.5rem;
                font-size: 0.65rem;
            }
            .context-usage-text {
                min-width: 4.5em;
            }
        }

        .status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.7rem;
            color: #888;
        }
        
        @media (max-width: 480px) {
            .header {
                padding: 0.5rem 0.75rem;
            }
            
            .header h1 {
                font-size: 1rem;
            }
            
            .status {
                font-size: 0.65rem;
            }
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #666;
        }

        .status-dot.connected {
            background: #00ff88;
            box-shadow: 0 0 8px #00ff88;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.75rem 0.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
            -webkit-overflow-scrolling: touch;
            min-height: 0; /* Critical for flexbox scrolling */
        }
        
        @media (max-width: 480px) {
            .messages {
                padding: 0.5rem 0.25rem;
                gap: 0.5rem;
            }
        }

        .message {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            animation: fadeIn 0.2s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        .message.system {
            align-items: center;
            opacity: 0.7;
        }

        .message-bubble {
            max-width: 85%;
            padding: 0.75rem 1rem;
            border-radius: 1rem;
            word-wrap: break-word;
            word-break: break-word;
            overflow-wrap: break-word;
            line-height: 1.5;
            font-size: 0.95rem;
            min-width: 0; /* Allow shrinking */
        }
        
        @media (max-width: 480px) {
            .message-bubble {
                max-width: 90%;
                padding: 0.6rem 0.85rem;
                font-size: 0.9rem;
            }
        }
        
        @media (max-width: 360px) {
            .message-bubble {
                max-width: 95%;
                padding: 0.5rem 0.75rem;
                font-size: 0.85rem;
            }
        }

        .message.user .message-bubble {
            background: #00ff88;
            color: #0a0a0a;
            border-bottom-right-radius: 0.25rem;
        }

        .message.ai .message-bubble {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            border-bottom-left-radius: 0.25rem;
        }
        
        /* Markdown styling for AI messages */
        .message.ai .message-bubble h1,
        .message.ai .message-bubble h2,
        .message.ai .message-bubble h3,
        .message.ai .message-bubble h4 {
            color: #00ff88;
            margin: 1rem 0 0.5rem 0;
            font-weight: 600;
            line-height: 1.3;
        }
        
        .message.ai .message-bubble h1 {
            font-size: 1.3em;
            border-bottom: 1px solid #333;
            padding-bottom: 0.3rem;
        }
        
        .message.ai .message-bubble h2 {
            font-size: 1.2em;
        }
        
        .message.ai .message-bubble h3 {
            font-size: 1.1em;
        }
        
        .message.ai .message-bubble h4 {
            font-size: 1.05em;
        }
        
        .message.ai .message-bubble p {
            margin: 0.75rem 0;
            line-height: 1.6;
        }
        
        .message.ai .message-bubble p:first-child {
            margin-top: 0;
        }
        
        .message.ai .message-bubble p:last-child {
            margin-bottom: 0;
        }
        
        .message.ai .message-bubble ul,
        .message.ai .message-bubble ol {
            margin: 0.75rem 0;
            padding-left: 1.5rem;
            line-height: 1.6;
        }
        
        .message.ai .message-bubble li {
            margin: 0.4rem 0;
        }
        
        .message.ai .message-bubble ul {
            list-style-type: disc;
        }
        
        .message.ai .message-bubble ol {
            list-style-type: decimal;
        }
        
        .message.ai .message-bubble code {
            background: #0a0a0a;
            color: #00ff88;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            border: 1px solid #333;
        }
        
        .message.ai .message-bubble pre {
            background: #0a0a0a;
            color: #e0e0e0;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid #333;
            overflow-x: auto;
            margin: 0.75rem 0;
            font-family: 'Courier New', monospace;
            font-size: 0.85em;
            line-height: 1.5;
        }
        
        .message.ai .message-bubble pre code {
            background: transparent;
            padding: 0;
            border: none;
            color: inherit;
        }
        
        .message.ai .message-bubble blockquote {
            border-left: 3px solid #00ff88;
            padding-left: 1rem;
            margin: 0.75rem 0;
            color: #aaa;
            font-style: italic;
        }
        
        .message.ai .message-bubble strong,
        .message.ai .message-bubble b {
            color: #00ff88;
            font-weight: 600;
        }
        
        .message.ai .message-bubble em,
        .message.ai .message-bubble i {
            font-style: italic;
            color: #ccc;
        }
        
        .message.ai .message-bubble a {
            color: #00aaff;
            text-decoration: underline;
            word-break: break-all;
        }
        
        .message.ai .message-bubble a:hover {
            color: #00ff88;
        }
        
        .message.ai .message-bubble hr {
            border: none;
            border-top: 1px solid #333;
            margin: 1rem 0;
        }
        
        .message.ai .message-bubble table {
            border-collapse: collapse;
            margin: 0.75rem 0;
            width: 100%;
        }
        
        .message.ai .message-bubble table th,
        .message.ai .message-bubble table td {
            border: 1px solid #333;
            padding: 0.5rem;
            text-align: left;
        }
        
        .message.ai .message-bubble table th {
            background: #0a0a0a;
            color: #00ff88;
            font-weight: 600;
        }

        .message.system .message-bubble {
            background: transparent;
            color: #888;
            font-size: 0.85rem;
            padding: 0.5rem;
        }

        .message-time {
            font-size: 0.7rem;
            color: #666;
            padding: 0 0.5rem;
        }

        .input-area {
            background: #1a1a1a;
            border-top: 1px solid #333;
            padding: 0.75rem;
            display: flex;
            gap: 0.5rem;
            flex-shrink: 0;
            min-height: 60px;
        }
        
        @media (max-width: 480px) {
            .input-area {
                padding: 0.5rem;
                gap: 0.4rem;
            }
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        #messageInput {
            width: 100%;
            padding: 0.6rem 0.85rem;
            background: #0a0a0a;
            border: 1px solid #333;
            border-radius: 1.5rem;
            color: #e0e0e0;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
            appearance: none;
        }
        
        @media (max-width: 480px) {
            #messageInput {
                padding: 0.5rem 0.75rem;
                font-size: 0.9rem;
            }
        }

        #messageInput:focus {
            border-color: #00ff88;
        }
        
        /* Scroll input into view when keyboard appears */
        @media (max-width: 768px) {
            #messageInput:focus {
                scroll-margin-bottom: 20px;
            }
        }

        #sendButton {
            padding: 0.6rem 1.2rem;
            background: #00ff88;
            color: #0a0a0a;
            border: none;
            border-radius: 1.5rem;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: opacity 0.2s;
            flex-shrink: 0;
            white-space: nowrap;
            touch-action: manipulation;
        }
        
        @media (max-width: 480px) {
            #sendButton {
                padding: 0.5rem 1rem;
                font-size: 0.8rem;
            }
        }

        #sendButton:active {
            opacity: 0.7;
        }

        #sendButton:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 0.5rem 0.75rem;
            color: #888;
            font-size: 0.8rem;
            font-style: italic;
            flex-shrink: 0;
        }

        .typing-indicator.active {
            display: block;
        }
        
        @media (max-width: 480px) {
            .typing-indicator {
                padding: 0.4rem 0.5rem;
                font-size: 0.75rem;
            }
        }

        /* Scrollbar styling */
        .messages::-webkit-scrollbar {
            width: 4px;
        }

        .messages::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        .messages::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 2px;
        }

        .messages::-webkit-scrollbar-thumb:hover {
            background: #444;
        }
        
        /* Prevent horizontal scrolling */
        html, body {
            overflow-x: hidden;
            width: 100%;
            max-width: 100%;
        }
        
        /* Safe area insets for notched devices */
        @supports (padding: max(0px)) {
            .header {
                padding-left: max(0.75rem, env(safe-area-inset-left));
                padding-right: max(0.75rem, env(safe-area-inset-right));
            }
            
            .input-area {
                padding-left: max(0.75rem, env(safe-area-inset-left));
                padding-right: max(0.75rem, env(safe-area-inset-right));
                padding-bottom: max(0.75rem, env(safe-area-inset-bottom));
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Loom Chat</h1>
        <div class="status">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">Connecting...</span>
        </div>
    </div>
    
    <div class="context-usage" id="contextUsage">
        <div class="context-usage-bar">
            <div class="context-usage-fill" id="contextUsageFill" style="width: 0%"></div>
        </div>
        <span class="context-usage-text" id="contextUsageText">0 / 128k tokens</span>
    </div>
    
    <div id="connectionInfo" style="display: none; background: #1a1a1a; padding: 0.4rem 0.5rem; border-bottom: 1px solid #333; font-size: 0.7rem; color: #888; text-align: center; flex-shrink: 0; word-break: break-all; overflow-wrap: break-word;">
        <span id="connectionUrl"></span>
    </div>

    <div class="messages" id="messages">
        <!-- Messages will be loaded from history or added dynamically -->
    </div>

    <div class="typing-indicator" id="typingIndicator">AI is thinking...</div>

    <div class="input-area">
        <div class="input-wrapper">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Type your message..." 
                autocomplete="off"
                autofocus
            />
        </div>
        <button id="sendButton" onclick="sendMessage()">Send</button>
    </div>

    <script>
        // Wait for DOM and Socket.IO to be ready
        document.addEventListener('DOMContentLoaded', function() {
            // Check if Socket.IO is loaded
            if (typeof io === 'undefined') {
                console.error('Socket.IO library not loaded');
                document.getElementById('statusText').textContent = 'Socket.IO not loaded';
                addSystemMessage('ERROR: Socket.IO library failed to load. Check your internet connection.');
                return;
            }

            // Auto-detect backend URL
            const backendUrl = window.location.origin;
            console.log('[LOOM] Connecting to:', backendUrl);
            
            // Show connection URL
            const connectionInfo = document.getElementById('connectionInfo');
            const connectionUrl = document.getElementById('connectionUrl');
            if (connectionInfo && connectionUrl) {
                connectionUrl.textContent = `Connecting to: ${backendUrl}`;
                connectionInfo.style.display = 'block';
            }
            
            // Test backend connectivity first
            fetch(`${backendUrl}/health`)
                .then(res => {
                    if (res.ok) {
                        console.log('[LOOM] Backend health check passed');
                        addSystemMessage('Backend is reachable. Connecting...');
                    } else {
                        console.error('[LOOM] Backend health check failed:', res.status);
                        addSystemMessage(`WARNING: Backend returned status ${res.status}. Connection may still work.`);
                    }
                })
                .catch(err => {
                    console.error('[LOOM] Backend health check error:', err);
                    addSystemMessage(`ERROR: Cannot reach backend at ${backendUrl}. Make sure the server is running and accessible.`);
                    document.getElementById('statusText').textContent = 'Backend unreachable';
                });

            // Wait a moment for Socket.IO to fully load, then connect
            let socket;
            setTimeout(() => {
                if (typeof io === 'undefined') {
                    console.error('[LOOM] Socket.IO not loaded after timeout');
                    addSystemMessage('ERROR: Socket.IO library failed to load. Check your internet connection.');
                    statusText.textContent = 'Socket.IO not loaded';
                    return;
                }
                
                console.log('[LOOM] Initializing Socket.IO connection to:', backendUrl);
                console.log('[LOOM] Socket.IO library version:', io ? 'loaded' : 'missing');
                
                try {
                    socket = io(backendUrl, {
                        transports: ['websocket', 'polling'],
                        reconnection: true,
                        reconnectionAttempts: 10,
                        reconnectionDelay: 2000,
                        timeout: 15000,
                        forceNew: false,
                    });
                    
                    // Store socket globally for sendMessage
                    window.loomSocket = socket;
                    
                    // Set up handlers immediately
                    setupSocketHandlers(socket);
                    
                    // Log connection state
                    console.log('[LOOM] Socket created, initial state:', socket.connected ? 'connected' : 'disconnected');
                    
                    // Add timeout check
                    setTimeout(() => {
                        if (!socket.connected) {
                            console.warn('[LOOM] Socket still not connected after 2 seconds');
                            addSystemMessage('Connection taking longer than expected...');
                        }
                    }, 2000);
                } catch (error) {
                    console.error('[LOOM] Error creating socket:', error);
                    addSystemMessage('ERROR: Failed to create Socket.IO connection: ' + error.message);
                }
            }, 100);

            const messagesDiv = document.getElementById('messages');
            const messageInput = document.getElementById('messageInput');
            const sendButton = document.getElementById('sendButton');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const typingIndicator = document.getElementById('typingIndicator');

            const STORAGE_KEY = 'loom-mobile-chat-history';
            const MAX_STORED_MESSAGES = 1000; // Keep up to 1000 messages
            
            // Context window: ~4 chars ≈ 1 token (rough). llama3.1:8b ~128k; adjust if using smaller model.
            const CONTEXT_LIMIT_TOKENS = 128000;
            const CHARS_PER_TOKEN = 4;

            let currentAIResponse = null;
            let isProcessing = false;
            let messageHistory = []; // Array to store all messages

            // Load message history from localStorage
            function loadHistory() {
                try {
                    const stored = localStorage.getItem(STORAGE_KEY);
                    if (stored) {
                        const parsed = JSON.parse(stored);
                        if (Array.isArray(parsed) && parsed.length > 0) {
                            messageHistory = parsed;
                            // Restore messages to UI
                            parsed.forEach(msg => {
                                restoreMessage(msg);
                            });
                            scrollToBottom();
                            return;
                        }
                    }
                } catch (e) {
                    console.warn('Failed to load chat history:', e);
                }
                // No history or error - start fresh
                messageHistory = [];
            }

            // Save message history to localStorage
            function saveHistory() {
                try {
                    // Keep only the last N messages to avoid storage quota issues
                    const toSave = messageHistory.slice(-MAX_STORED_MESSAGES);
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                } catch (e) {
                    console.warn('Failed to save chat history:', e);
                    // If quota exceeded, try to save fewer messages
                    if (e.name === 'QuotaExceededError') {
                        try {
                            const toSave = messageHistory.slice(-500);
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(toSave));
                        } catch (e2) {
                            console.error('Failed to save even reduced history:', e2);
                        }
                    }
                }
            }

            // Restore a message from history
            function restoreMessage(msg) {
                const messageDiv = document.createElement('div');
                messageDiv.className = `message ${msg.type}`;
                
                if (msg.type === 'system') {
                    messageDiv.innerHTML = `<div class="message-bubble">${escapeHtml(msg.content)}</div>`;
                } else if (msg.type === 'ai') {
                    // Use markdown rendering for AI messages
                    messageDiv.innerHTML = `
                        <div class="message-bubble">${renderMarkdown(msg.content || '')}</div>
                        <div class="message-time">${formatTimestamp(msg.timestamp)}</div>
                    `;
                } else {
                    messageDiv.innerHTML = `
                        <div class="message-bubble">${escapeHtml(msg.content)}</div>
                        <div class="message-time">${formatTimestamp(msg.timestamp)}</div>
                    `;
                }
                
                messagesDiv.appendChild(messageDiv);
                
                // If it's an AI message that was in progress, mark it as complete
                if (msg.type === 'ai' && msg.isComplete) {
                    // Message is already complete, nothing to do
                }
            }

            // Format timestamp for display
            function formatTimestamp(timestamp) {
                if (!timestamp) return getTimeString();
                const date = new Date(timestamp);
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            // Load history on page load
            loadHistory();
            updateContextIndicator();
            
            // If no history, show initial message
            if (messageHistory.length === 0) {
                addSystemMessage('Connecting to Loom...');
                // Show connection info
                addSystemMessage(`Backend URL: ${backendUrl}`);
                // Test Socket.IO endpoint
                fetch(`${backendUrl}/socket.io/?EIO=4&transport=polling`)
                    .then(res => {
                        console.log('[LOOM] Socket.IO endpoint test:', res.status, res.statusText);
                        if (res.ok || res.status === 400) {
                            // 400 is normal for Socket.IO handshake
                            addSystemMessage('Socket.IO endpoint reachable');
                        }
                    })
                    .catch(err => {
                        console.error('[LOOM] Socket.IO endpoint test failed:', err);
                        addSystemMessage('WARNING: Socket.IO endpoint may not be accessible');
                    });
            }

            // Socket connection handlers - need to wait for socket to be created
            function setupSocketHandlers(socket) {
                socket.on('connect', () => {
                console.log('[LOOM] Socket.IO connected');
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected';
                
                // Hide connection info on success
                if (connectionInfo) {
                    connectionInfo.style.display = 'none';
                }
                
                // Only add connection message if we don't have history (fresh start)
                // and remove the "Connecting..." message if it exists
                if (messageHistory.length === 0) {
                    // Remove any "Connecting..." or error messages
                    const systemMessages = messagesDiv.querySelectorAll('.message.system');
                    systemMessages.forEach(msg => {
                        const text = msg.querySelector('.message-bubble')?.textContent || '';
                        if (text.includes('Connecting') || text.includes('ERROR') || text.includes('WARNING') || text.includes('Backend URL')) {
                            msg.remove();
                        }
                    });
                    addSystemMessage('✓ Connected to Loom backend');
                }
            });

            socket.on('disconnect', (reason) => {
                console.log('[LOOM] Socket.IO disconnected:', reason);
                statusDot.classList.remove('connected');
                statusText.textContent = 'Disconnected';
                if (reason === 'io server disconnect') {
                    addSystemMessage('Disconnected by server');
                } else {
                    addSystemMessage('Disconnected from backend');
                }
            });

            socket.on('connect_error', (error) => {
                console.error('[LOOM] Socket.IO connection error:', error);
                statusDot.classList.remove('connected');
                statusText.textContent = 'Connection error';
                
                // Show connection info on error
                if (connectionInfo && connectionUrl) {
                    connectionUrl.textContent = `Failed: ${backendUrl} - ${error.message}`;
                    connectionInfo.style.display = 'block';
                    connectionInfo.style.background = '#3a1a1a';
                    connectionInfo.style.color = '#ff6666';
                }
                
                let errorMsg = 'Failed to connect: ' + error.message;
                if (error.message.includes('xhr poll error') || error.message.includes('NetworkError')) {
                    errorMsg = `Network error: Cannot reach ${backendUrl}\n\n` +
                              `Troubleshooting:\n` +
                              `1. Is the backend running? (Check terminal)\n` +
                              `2. Are you on the same Wi-Fi network?\n` +
                              `3. Is firewall blocking port 8000?\n` +
                              `4. Try: http://YOUR_COMPUTER_IP:8000/test\n\n` +
                              `Get your IP: Run ./get-chat-url.sh on your computer`;
                } else if (error.message.includes('timeout')) {
                    errorMsg = 'Connection timeout. The server may be unreachable or blocked.\n\n' +
                              `Trying to connect to: ${backendUrl}`;
                }
                
                addSystemMessage(errorMsg);
            });

            socket.on('reconnect_attempt', (attemptNumber) => {
                console.log('[LOOM] Reconnection attempt:', attemptNumber);
                statusText.textContent = `Reconnecting... (${attemptNumber})`;
            });

                socket.on('reconnect_failed', () => {
                    console.error('[LOOM] Reconnection failed');
                    statusText.textContent = 'Reconnection failed';
                    addSystemMessage('Failed to reconnect. Please refresh the page.');
                });

                // AI response handlers
                socket.on('ai_chunk', (data) => {
                if (!currentAIResponse) {
                    currentAIResponse = addAIMessage('');
                    typingIndicator.classList.remove('active');
                    // Add to history
                    const msg = {
                        type: 'ai',
                        content: '',
                        timestamp: Date.now(),
                        isComplete: false
                    };
                    messageHistory.push(msg);
                    // Store reference to message in DOM element
                    currentAIResponse._historyIndex = messageHistory.length - 1;
                }
                // Append content
                appendToMessage(currentAIResponse, data.content);
                // Update history
                if (currentAIResponse._historyIndex !== undefined) {
                    messageHistory[currentAIResponse._historyIndex].content += data.content;
                    saveHistory();
                    updateContextIndicator();
                }
            });

            socket.on('ai_status', (data) => {
                if (data.status === 'running') {
                    typingIndicator.classList.add('active');
                    isProcessing = true;
                    updateSendButton();
                } else if (data.status === 'success' || data.status === 'error') {
                    typingIndicator.classList.remove('active');
                    isProcessing = false;
                    updateSendButton();
                    
                    if (data.status === 'error') {
                        if (currentAIResponse) {
                            const errorMsg = 'Error: ' + (data.message || 'Unknown error');
                            currentAIResponse.querySelector('.message-bubble').textContent = errorMsg;
                            // Update history
                            if (currentAIResponse._historyIndex !== undefined) {
                                messageHistory[currentAIResponse._historyIndex].content = errorMsg;
                                messageHistory[currentAIResponse._historyIndex].isComplete = true;
                                saveHistory();
                            }
                        } else {
                            addSystemMessage('Error: ' + (data.message || 'Unknown error'));
                        }
                    } else {
                        // Success - mark as complete in history
                        if (currentAIResponse && currentAIResponse._historyIndex !== undefined) {
                            messageHistory[currentAIResponse._historyIndex].isComplete = true;
                            saveHistory();
                        }
                    }
                    currentAIResponse = null;
                    updateContextIndicator();
                }
                });
            }
            

            // Message handling functions
            function addUserMessage(text) {
                const timestamp = Date.now();
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message user';
                messageDiv.innerHTML = `
                    <div class="message-bubble">${escapeHtml(text)}</div>
                    <div class="message-time">${getTimeString()}</div>
                `;
                messagesDiv.appendChild(messageDiv);
                scrollToBottom();
                
                // Save to history
                messageHistory.push({
                    type: 'user',
                    content: text,
                    timestamp: timestamp
                });
                saveHistory();
                updateContextIndicator();
            }

            function addAIMessage(text) {
                const timestamp = Date.now();
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message ai';
                messageDiv.innerHTML = `
                    <div class="message-bubble">${renderMarkdown(text)}</div>
                    <div class="message-time">${getTimeString()}</div>
                `;
                messagesDiv.appendChild(messageDiv);
                scrollToBottom();
                return messageDiv;
            }

            function appendToMessage(messageDiv, text) {
                const bubble = messageDiv.querySelector('.message-bubble');
                const currentText = bubble.textContent || '';
                const newText = currentText + text;
                // Re-render markdown for the full text
                bubble.innerHTML = renderMarkdown(newText);
                scrollToBottom();
            }

            function addSystemMessage(text) {
                const timestamp = Date.now();
                const messageDiv = document.createElement('div');
                messageDiv.className = 'message system';
                messageDiv.innerHTML = `<div class="message-bubble">${escapeHtml(text)}</div>`;
                messagesDiv.appendChild(messageDiv);
                scrollToBottom();
                
                // Save to history (but filter out connection messages on reload)
                if (!text.includes('Connected to Loom backend') || messageHistory.length === 0) {
                    messageHistory.push({
                        type: 'system',
                        content: text,
                        timestamp: timestamp
                    });
                    saveHistory();
                }
                updateContextIndicator();
            }

            function escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
            
            // Simple markdown to HTML converter
            function renderMarkdown(text) {
                if (!text) return '';
                
                let html = text;
                
                // Escape HTML first
                html = escapeHtml(html);
                
                // Code blocks (before inline code) - preserve newlines in code
                html = html.replace(/```([\s\S]*?)```/g, (match, code) => {
                    return '<pre><code>' + code.trim() + '</code></pre>';
                });
                
                // Process line by line for better control
                const lines = html.split('\n');
                const processedLines = [];
                let inCodeBlock = false;
                let inList = false;
                let listItems = [];
                let listIsOrdered = false;
                
                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i];
                    const trimmed = line.trim();
                    
                    // Check if we're in a code block
                    if (line.includes('<pre><code>')) {
                        inCodeBlock = true;
                        processedLines.push(line);
                        continue;
                    }
                    if (line.includes('</code></pre>')) {
                        inCodeBlock = false;
                        processedLines.push(line);
                        continue;
                    }
                    if (inCodeBlock) {
                        processedLines.push(line);
                        continue;
                    }
                    
                    // Horizontal rules (must be mostly dashes)
                    if (trimmed.match(/^-{3,}$/)) {
                        // Close any open list
                        if (inList) {
                            const listType = listIsOrdered ? 'ol' : 'ul';
                            processedLines.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
                            listItems = [];
                            inList = false;
                        }
                        processedLines.push('<hr>');
                        continue;
                    }
                    
                    // Headers - handle cases like "---## 3" or "|### TL;DR"
                    if (trimmed.match(/^#+\s/)) {
                        // Close any open list
                        if (inList) {
                            const listType = listIsOrdered ? 'ol' : 'ul';
                            processedLines.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
                            listItems = [];
                            inList = false;
                        }
                        // Clean up header - remove leading dashes, pipes, etc.
                        let headerText = trimmed.replace(/^[-|]+\s*/, '').replace(/^#+\s*/, '');
                        const level = (trimmed.match(/^#+/)?.[0] || '').length;
                        if (level === 1) processedLines.push(`<h1>${headerText}</h1>`);
                        else if (level === 2) processedLines.push(`<h2>${headerText}</h2>`);
                        else if (level >= 3) processedLines.push(`<h3>${headerText}</h3>`);
                        continue;
                    }
                    
                    // Also catch headers with leading characters like "---## 3"
                    if (trimmed.match(/[-|]+\s*#+\s/)) {
                        if (inList) {
                            const listType = listIsOrdered ? 'ol' : 'ul';
                            processedLines.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
                            listItems = [];
                            inList = false;
                        }
                        let headerText = trimmed.replace(/^[-|]+\s*#+\s*/, '');
                        const level = (trimmed.match(/#+/)?.[0] || '').length;
                        if (level === 1) processedLines.push(`<h1>${headerText}</h1>`);
                        else if (level === 2) processedLines.push(`<h2>${headerText}</h2>`);
                        else if (level >= 3) processedLines.push(`<h3>${headerText}</h3>`);
                        continue;
                    }
                    
                    // Tables - detect lines with multiple pipes
                    if (trimmed.includes('|') && trimmed.split('|').length >= 3 && !trimmed.match(/^[-|]+$/)) {
                        if (inList) {
                            const listType = listIsOrdered ? 'ol' : 'ul';
                            processedLines.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
                            listItems = [];
                            inList = false;
                        }
                        // Check if it's a table separator row
                        if (trimmed.match(/^[\s|:-\-]+$/)) {
                            // Skip separator rows
                            continue;
                        }
                        // Parse table row
                        const cells = trimmed.split('|').map(cell => cell.trim()).filter(cell => cell);
                        if (cells.length > 0) {
                            const isHeader = i === 0 || lines[i-1]?.trim().match(/^[\s|:-\-]+$/);
                            const tag = isHeader ? 'th' : 'td';
                            processedLines.push(`<tr>${cells.map(cell => `<${tag}>${cell}</${tag}>`).join('')}</tr>`);
                            if (isHeader && !processedLines.includes('<table>')) {
                                processedLines.splice(processedLines.length - 1, 0, '<table>');
                            }
                            // Check if next line is not a table row
                            if (i === lines.length - 1 || !lines[i+1]?.trim().includes('|') || lines[i+1]?.trim().match(/^[\s|:-\-]+$/)) {
                                processedLines.push('</table>');
                            }
                        }
                        continue;
                    }
                    
                    // Lists
                    const unorderedMatch = trimmed.match(/^[\*\-]\s+(.+)$/);
                    const orderedMatch = trimmed.match(/^\d+\.\s+(.+)$/);
                    
                    if (unorderedMatch || orderedMatch) {
                        const content = (unorderedMatch || orderedMatch)[1];
                        const isOrdered = !!orderedMatch;
                        
                        if (!inList || (isOrdered !== listIsOrdered)) {
                            // Close previous list if different type
                            if (inList) {
                                const listType = listIsOrdered ? 'ol' : 'ul';
                                processedLines.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
                                listItems = [];
                            }
                            inList = true;
                            listIsOrdered = isOrdered;
                        }
                        listItems.push(content);
                        continue;
                    } else if (inList) {
                        // Close list
                        const listType = listIsOrdered ? 'ol' : 'ul';
                        processedLines.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
                        listItems = [];
                        inList = false;
                    }
                    
                    // Blockquotes
                    if (trimmed.match(/^>\s/)) {
                        processedLines.push(`<blockquote>${trimmed.replace(/^>\s*/, '')}</blockquote>`);
                        continue;
                    }
                    
                    // Regular line - process inline markdown
                    if (trimmed) {
                        // Inline code
                        line = line.replace(/`([^`\n]+)`/g, '<code>$1</code>');
                        
                        // Bold
                        line = line.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
                        line = line.replace(/__([^_]+)__/g, '<strong>$1</strong>');
                        
                        // Italic
                        line = line.replace(/\*([^*]+)\*/g, '<em>$1</em>');
                        line = line.replace(/_([^_]+)_/g, '<em>$1</em>');
                        
                        // Links
                        line = line.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
                        
                        processedLines.push(line);
                    } else {
                        processedLines.push('');
                    }
                }
                
                // Close any remaining list
                if (inList) {
                    const listType = listIsOrdered ? 'ol' : 'ul';
                    processedLines.push(`<${listType}>${listItems.map(item => `<li>${item}</li>`).join('')}</${listType}>`);
                }
                
                // Group into paragraphs
                html = processedLines.join('\n');
                html = html.split(/\n\n+/).map(block => {
                    block = block.trim();
                    if (!block) return '';
                    // Don't wrap block elements
                    if (block.match(/^<(h[1-6]|ul|ol|pre|blockquote|hr|table)/)) {
                        return block;
                    }
                    // Convert single newlines to <br>
                    block = block.replace(/\n/g, '<br>');
                    return '<p>' + block + '</p>';
                }).join('\n');
                
                // Clean up
                html = html.replace(/<p><\/p>/g, '');
                html = html.replace(/<p>\s*<\/p>/g, '');
                
                return html;
            }

            function getTimeString() {
                const now = new Date();
                return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            function scrollToBottom() {
                messagesDiv.scrollTop = messagesDiv.scrollHeight;
            }

            function updateSendButton() {
                sendButton.disabled = isProcessing || !messageInput.value.trim();
            }

            // Input handling
            messageInput.addEventListener('input', updateSendButton);
            messageInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    window.sendMessage();
                }
            });
            
            // Scroll input into view when focused (fix keyboard covering)
            messageInput.addEventListener('focus', () => {
                setTimeout(() => {
                    messageInput.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    // Also scroll messages to show more context
                    setTimeout(() => {
                        scrollToBottom();
                    }, 300);
                }, 100);
            });
            
            // Handle viewport resize (keyboard appearing/disappearing)
            let viewportHeight = window.visualViewport?.height || window.innerHeight;
            if (window.visualViewport) {
                window.visualViewport.addEventListener('resize', () => {
                    const newHeight = window.visualViewport.height;
                    if (newHeight < viewportHeight) {
                        // Keyboard appeared - scroll input into view
                        setTimeout(() => {
                            messageInput.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                        }, 100);
                    }
                    viewportHeight = newHeight;
                });
            }

            // Focus input on load
            messageInput.focus();

            // Estimate tokens from character count (~4 chars per token for English)
            function charsToTokens(chars) {
                return Math.ceil(chars / CHARS_PER_TOKEN);
            }

            // Get size of context that would be sent with the next message
            function getContextSize() {
                const allHistory = messageHistory.filter(msg => msg.type === 'user' || msg.type === 'ai');
                let recentHistory = allHistory.slice(-16);
                if (recentHistory.length === 0) return { chars: 0, tokens: 0, messageCount: 0 };
                
                const historyBlock = recentHistory.map(msg => {
                    if (msg.type === 'user') return `User: ${msg.content}`;
                    if (msg.type === 'ai') {
                        const content = msg.content || '';
                        return `Assistant: ${content.length > 500 ? content.substring(0, 500) + '...' : content}`;
                    }
                    return '';
                }).filter(Boolean).join('\n\n');
                
                const chars = historyBlock.length;
                const tokens = charsToTokens(chars);
                return { chars, tokens, messageCount: recentHistory.length };
            }

            function updateContextIndicator() {
                const fillEl = document.getElementById('contextUsageFill');
                const textEl = document.getElementById('contextUsageText');
                if (!fillEl || !textEl) return;
                
                const { tokens, messageCount } = getContextSize();
                const percent = Math.min(100, (tokens / CONTEXT_LIMIT_TOKENS) * 100);
                
                fillEl.style.width = percent + '%';
                fillEl.classList.remove('warn', 'danger');
                if (percent >= 90) fillEl.classList.add('danger');
                else if (percent >= 70) fillEl.classList.add('warn');
                
                const tokensStr = tokens >= 1000 ? (tokens / 1000).toFixed(1) + 'k' : String(tokens);
                const limitStr = CONTEXT_LIMIT_TOKENS >= 1000 ? (CONTEXT_LIMIT_TOKENS / 1000) + 'k' : String(CONTEXT_LIMIT_TOKENS);
                textEl.textContent = `~${tokensStr} / ${limitStr} tokens`;
                textEl.title = `${messageCount} msgs in context • ~${tokens.toLocaleString()} tokens (est.)`;
            }

            // Build conversation history for context (excluding the current message)
            function buildConversationContext() {
                // Get recent conversation history (last 16 messages to avoid token limits)
                // Exclude the last message if it's a user message (the one we're about to send)
                const allHistory = messageHistory.filter(msg => msg.type === 'user' || msg.type === 'ai');
                
                // Exclude the last message if it's a user message (since we're about to send it)
                let recentHistory = allHistory;
                if (allHistory.length > 0 && allHistory[allHistory.length - 1].type === 'user') {
                    recentHistory = allHistory.slice(0, -1);
                }
                
                // Take last 16 messages for context
                recentHistory = recentHistory.slice(-16);
                
                if (recentHistory.length === 0) {
                    return null; // No history
                }
                
                // Build conversation context
                const historyBlock = recentHistory.map(msg => {
                    if (msg.type === 'user') {
                        return `User: ${msg.content}`;
                    } else if (msg.type === 'ai') {
                        // Truncate very long AI responses to keep context manageable
                        const content = msg.content || '';
                        if (content.length > 500) {
                            return `Assistant: ${content.substring(0, 500)}...`;
                        }
                        return `Assistant: ${content}`;
                    }
                    return '';
                }).filter(Boolean).join('\n\n');
                
                return historyBlock;
            }

            // Handle remote control commands
            async function handleRemoteCommand(command, args) {
                const cmd = command.toLowerCase();
                
                switch (cmd) {
                    case 'help':
                    case 'commands':
                        // Test remote router first
                        try {
                            const testRes = await fetch(`${backendUrl}/api/remote/test`);
                            const testData = await testRes.json();
                            const helpText = `REMOTE CONTROL COMMANDS:

📊 SYSTEM:
  /status          - Show system status (CPU, RAM, disk)
  /processes       - Show top running processes

📁 FILES:
  /files <path>    - List files in directory
  /read <file>      - Read a file (first 50 lines)
  /read <file> N    - Read first N lines of file

⚡ COMMANDS:
  /cmd <command>   - Execute shell command (safe commands only)
  /run <command>   - Alias for /cmd

💬 CHAT:
  /ai <prompt>     - Send to AI (default model: llama3.1:8b)
  /clear           - Clear chat history
  /history         - Show command history

Examples:
  /status
  /files ~/Documents
  /read ~/.bashrc 20
  /cmd ls -la
  /cmd ps aux | head -10

✓ Remote router: ${testData.message || 'active'}`;
                            addSystemMessage(helpText);
                        } catch (e) {
                            const helpText = `REMOTE CONTROL COMMANDS:

⚠️ Remote router not available. Restart backend to enable.

Default AI model: llama3.1:8b

Basic commands still work:
  /clear           - Clear chat history
  /history         - Show command history`;
                            addSystemMessage(helpText);
                        }
                        return true;
                    
                    case 'status':
                        try {
                            const res = await fetch(`${backendUrl}/api/remote/system/status`);
                            if (!res.ok) {
                                throw new Error(`HTTP ${res.status}: ${res.statusText}`);
                            }
                            const data = await res.json();
                            const statusText = `SYSTEM STATUS:

CPU: ${data.cpu.percent.toFixed(1)}% (${data.cpu.cores} cores)
RAM: ${data.memory.used_gb.toFixed(1)}GB / ${data.memory.total_gb.toFixed(1)}GB (${data.memory.percent.toFixed(1)}%)
Disk: ${data.disk.used_gb.toFixed(1)}GB / ${data.disk.total_gb.toFixed(1)}GB (${data.disk.percent.toFixed(1)}%)
Processes: ${data.processes}
Hostname: ${data.hostname}
Platform: ${data.platform}`;
                            addSystemMessage(statusText);
                        } catch (e) {
                            console.error('[LOOM] Status error:', e);
                            addSystemMessage(`Error: ${e.message}\n\nMake sure the backend has the remote router enabled.`);
                        }
                        return true;
                    
                    case 'processes':
                        try {
                            const res = await fetch(`${backendUrl}/api/remote/system/processes?limit=10`);
                            const data = await res.json();
                            let procText = 'TOP PROCESSES:\n\n';
                            data.processes.forEach((p, i) => {
                                procText += `${i + 1}. ${p.name} (PID: ${p.pid})\n`;
                                procText += `   CPU: ${p.cpu_percent?.toFixed(1) || 0}% | RAM: ${p.memory_percent?.toFixed(1) || 0}%\n`;
                            });
                            addSystemMessage(procText);
                        } catch (e) {
                            addSystemMessage(`Error: ${e.message}`);
                        }
                        return true;
                    
                    case 'files':
                    case 'ls':
                        const path = args.join(' ') || '~';
                        try {
                            const res = await fetch(`${backendUrl}/api/remote/files/list`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ path, show_hidden: false })
                            });
                            const data = await res.json();
                            let fileText = `FILES: ${data.path}\n\n`;
                            if (data.items.length === 0) {
                                fileText += '(empty)';
                            } else {
                                data.items.forEach(item => {
                                    const icon = item.type === 'directory' ? '📁' : '📄';
                                    const size = item.size ? ` (${formatBytes(item.size)})` : '';
                                    fileText += `${icon} ${item.name}${size}\n`;
                                });
                            }
                            addSystemMessage(fileText);
                        } catch (e) {
                            addSystemMessage(`Error: ${e.message}`);
                        }
                        return true;
                    
                    case 'read':
                    case 'cat':
                        if (args.length === 0) {
                            addSystemMessage('Usage: /read <file> [lines]');
                            return true;
                        }
                        const filePath = args[0];
                        const lines = args[1] ? parseInt(args[1]) : 50;
                        try {
                            const res = await fetch(`${backendUrl}/api/remote/files/read?file_path=${encodeURIComponent(filePath)}&lines=${lines}`);
                            const data = await res.json();
                            addSystemMessage(`FILE: ${data.path}\n\n${data.content}`);
                        } catch (e) {
                            addSystemMessage(`Error: ${e.message}`);
                        }
                        return true;
                    
                    case 'cmd':
                    case 'run':
                    case 'exec':
                        if (args.length === 0) {
                            addSystemMessage('Usage: /cmd <command>');
                            return true;
                        }
                        const command = args.join(' ');
                        try {
                            addSystemMessage(`Executing: ${command}...`);
                            const res = await fetch(`${backendUrl}/api/remote/command`, {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ command, timeout: 30 })
                            });
                            if (!res.ok) {
                                const errorData = await res.json().catch(() => ({ detail: res.statusText }));
                                throw new Error(errorData.detail || `HTTP ${res.status}`);
                            }
                            const data = await res.json();
                            let cmdText = `COMMAND: ${data.command}\n`;
                            cmdText += `STATUS: ${data.status} (exit code: ${data.returncode})\n\n`;
                            if (data.stdout) {
                                cmdText += `OUTPUT:\n${data.stdout}\n`;
                            }
                            if (data.stderr) {
                                cmdText += `ERRORS:\n${data.stderr}\n`;
                            }
                            addSystemMessage(cmdText);
                        } catch (e) {
                            console.error('[LOOM] Command error:', e);
                            addSystemMessage(`Error: ${e.message}\n\nMake sure the backend has the remote router enabled.`);
                        }
                        return true;
                    
                    case 'clear':
                        if (confirm('Clear all chat history?')) {
                            messageHistory = [];
                            messagesDiv.innerHTML = '';
                            localStorage.removeItem(STORAGE_KEY);
                            updateContextIndicator();
                            addSystemMessage('Chat history cleared.');
                        }
                        return true;
                    
                    case 'history':
                        const histCount = messageHistory.filter(m => m.type === 'user' || m.type === 'ai').length;
                        addSystemMessage(`Chat history: ${histCount} messages`);
                        return true;
                    
                    default:
                        return false; // Not a remote command
                }
            }
            
            function formatBytes(bytes) {
                if (bytes === 0) return '0 B';
                const k = 1024;
                const sizes = ['B', 'KB', 'MB', 'GB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
            }

            // Make sendMessage available globally for onclick handler
            window.sendMessage = async function() {
                const text = messageInput.value.trim();
                if (!text || isProcessing) return;

                // Check if it's a remote command
                if (text.startsWith('/')) {
                    const [command, ...args] = text.slice(1).split(' ');
                    // Add user message first
                    addUserMessage(text);
                    messageInput.value = '';
                    
                    // Try to handle as remote command
                    const handled = await handleRemoteCommand(command, args);
                    if (handled) {
                        return;
                    }
                    // If not handled, fall through to AI chat (but message already added)
                    // Remove the user message since we'll add it again below
                    messageHistory.pop();
                    messagesDiv.removeChild(messagesDiv.lastChild);
                }

                // Build conversation context BEFORE adding the new message
                const historyContext = buildConversationContext();
                
                // Now add the user message to history
                addUserMessage(text);
                messageInput.value = '';
                currentAIResponse = null;
                
                // Build final prompt with conversation history
                let finalPrompt = text;
                if (historyContext) {
                    finalPrompt = `Previous conversation:\n\n${historyContext}\n\nUser: ${text}`;
                }
                
                const socketToUse = window.loomSocket || socket;
                if (!socketToUse || !socketToUse.connected) {
                    addSystemMessage('ERROR: Not connected to backend. Please wait for connection or refresh the page.');
                    return;
                }
                
                socketToUse.emit('chat', {
                    prompt: finalPrompt,
                    model: 'llama3.1:8b' // Default model (was gpt-oss:120b; use llama for reliable mobile chat)
                });
                
                isProcessing = true;
                updateSendButton();
                typingIndicator.classList.add('active');
            };
        });
    </script>
</body>
</html>
